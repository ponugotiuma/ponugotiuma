name: Contribution Mining Animation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  build-miner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow

      - name: Generate mining animation from real GitHub contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ponugotiuma
        run: |
          cat > build_miner.py <<'PY'
          import os
          import requests
          from PIL import Image, ImageDraw

          TOKEN = os.environ["GITHUB_TOKEN"]
          USERNAME = os.environ["GITHUB_USERNAME"]

          query = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                      color
                    }
                  }
                }
              }
            }
          }
          """

          response = requests.post(
              "https://api.github.com/graphql",
              json={
                  "query": query,
                  "variables": {
                      "login": USERNAME
                  }
              },
              headers={
                  "Authorization": f"Bearer {TOKEN}",
                  "Content-Type": "application/json"
              },
              timeout=30
          )

          if response.status_code != 200:
              raise RuntimeError(
                  f"GitHub API HTTP {response.status_code}: {response.text}"
              )

          data = response.json()

          if "errors" in data:
              raise RuntimeError(
                  "GitHub GraphQL error:\n" + str(data["errors"])
              )

          calendar = (
              data["data"]["user"]
              ["contributionsCollection"]
              ["contributionCalendar"]
          )

          weeks = calendar["weeks"]

          print("Total contributions:", calendar["totalContributions"])
          print("Weeks received:", len(weeks))

          if not weeks:
              raise RuntimeError("No contribution data returned.")

          # -----------------------------
          # GAME SETTINGS
          # -----------------------------

          CELL = 18
          GAP = 4
          PADDING = 20

          cols = len(weeks)
          rows = 7

          width = PADDING * 2 + cols * (CELL + GAP)
          height = PADDING * 2 + rows * (CELL + GAP) + 50

          frames = []

          # -----------------------------
          # CREATE CONTRIBUTION MAP
          # -----------------------------

          grid = []

          for x, week in enumerate(weeks):
              column = []

              for day in week["contributionDays"]:
                  column.append({
                      "date": day["date"],
                      "count": day["contributionCount"],
                      "color": day["color"]
                  })

              while len(column) < 7:
                  column.append({
                      "date": "",
                      "count": 0,
                      "color": "#ebedf0"
                  })

              grid.append(column)

          # -----------------------------
          # GAME ANIMATION
          # -----------------------------

          for miner_x in range(cols):

              img = Image.new(
                  "RGB",
                  (width, height),
                  "#0d1117"
              )

              draw = ImageDraw.Draw(img)

              # Title
              draw.text(
                  (PADDING, 5),
                  "⛏️ Contribution Mining",
                  fill="white"
              )

              # Contribution grid
              for x, column in enumerate(grid):

                  for y, cell in enumerate(column):

                      px = PADDING + x * (CELL + GAP)
                      py = PADDING + 30 + y * (CELL + GAP)

                      count = cell["count"]

                      if count > 0:
                          color = cell["color"]
                      else:
                          color = "#21262d"

                      draw.rounded_rectangle(
                          [
                              px,
                              py,
                              px + CELL,
                              py + CELL
                          ],
                          radius=3,
                          fill=color
                      )

              # Miner position
              mx = PADDING + miner_x * (CELL + GAP)
              my = PADDING + 30 + 3 * (CELL + GAP)

              # Miner body
              draw.ellipse(
                  [mx - 4, my - 12, mx + 8, my],
                  fill="#f2cc8f"
              )

              # Helmet
              draw.rectangle(
                  [mx - 6, my - 14, mx + 10, my - 9],
                  fill="#f0c419"
              )

              # Body
              draw.rectangle(
                  [mx - 3, my, mx + 7, my + 12],
                  fill="#58a6ff"
              )

              # Backpack
              draw.rectangle(
                  [mx + 6, my + 2, mx + 12, my + 10],
                  fill="#8b5a2b"
              )

              # Hammer
              draw.line(
                  [mx - 7, my + 2, mx - 14, my - 8],
                  fill="#c9d1d9",
                  width=3
              )

              draw.rectangle(
                  [mx - 18, my - 11, mx - 8, my - 7],
                  fill="#c9d1d9"
              )

              frames.append(img)

          # -----------------------------
          # SAVE GIF
          # -----------------------------

          os.makedirs("assets", exist_ok=True)

          frames[0].save(
              "assets/contribution-miner.gif",
              save_all=True,
              append_images=frames[1:],
              duration=120,
              loop=0
          )

          print("Animation created successfully.")
          PY

          python build_miner.py

      - name: Publish animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/contribution-miner.gif

          git diff --cached --quiet || git commit -m "Update contribution mining animation"

          git push
