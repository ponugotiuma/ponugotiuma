name: Generate Minesweeper Contribution Animation

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      # Generate Minesweeper with GitHub-style contribution colors
      - name: Generate Minesweeper Contribution Graph
        run: |
          mkdir -p dist

          npx pacman-contribution-graph \
            --platform github \
            --username "${{ github.repository_owner }}" \
            --game minesweeper \
            --gameTheme github \
            --output dist/minesweeper-contribution-graph.svg

      # Generate dark version with GitHub dark colors
      - name: Generate Dark Minesweeper Contribution Graph
        run: |
          npx pacman-contribution-graph \
            --platform github \
            --username "${{ github.repository_owner }}" \
            --game minesweeper \
            --gameTheme github-dark \
            --output dist/minesweeper-contribution-graph-dark.svg

      # Push generated SVG files to output branch
      - name: Push Minesweeper animation to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
